name: Enhancement
description: A proposal, a gap to close, or a capability to add.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or costly today, with evidence.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What to build, and anything it depends on.
    validations:
      required: true
