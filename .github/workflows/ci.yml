# Typecheck, lint, test, conformance registry. The four commands are the same
# ones a contributor runs locally; CI adds nothing they cannot reproduce.
name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
    # `labeled` so that adding `run-driver` starts the paid run (D-A-CI-05).
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # To find and download the driver report a merged pull request's run kept (D-A-CI-06).
  actions: read

jobs:
  # The checks are four jobs that run side by side, and the one required
  # status check is the gate at the end, which passes only when all four did
  # (D-TOOLING-15). Every check still runs, each exactly once; what changed is
  # that the sandbox suite, the other packages' suites, and the registry no
  # longer wait for one another.

  # Repository hygiene, typecheck, lint, and the tooling outside the workspace.
  static:
    name: hygiene, typecheck, lint, tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No tracked file is covered by .gitignore
        run: |
          ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [ -n "$ignored" ]; then
            echo "$ignored"
            echo "::error::tracked files match .gitignore; they must never be committed"
            exit 1
          fi

      # The maintainer-local planning directory is never tracked and never
      # named by a tracked file. Scoped to that directory: the tracked
      # planning documents live under docs/plan/, so a search for the word
      # "plan" would report them and prove nothing. A reference is the
      # directory followed by a file name; CLAUDE.md holds the rule and its
      # one exception (the master plan) and is the only file allowed either.
      - name: Nothing under .plan/ is tracked or referenced
        run: |
          tracked="$(git ls-files -- .plan/)"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::files under the maintainer-local planning directory are tracked"
            exit 1
          fi
          # A review bundle is a byte copy of what a reviewer was sent, CLAUDE.md included when a unit changed it; it is never edited (D-A-CI-08).
          refs="$(git grep -nE '\.plan/[A-Za-z0-9_-]' -- ':!CLAUDE.md' ':!docs/reviews/*-review-bundle.txt' || true)"
          if [ -n "$refs" ]; then
            echo "$refs"
            echo "::error::tracked files reference a path under the maintainer-local planning directory"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # scripts/ is not a workspace package, so `pnpm -r typecheck` and
      # `pnpm -r test` cannot see it. Without these two steps the review
      # runner would ship untypechecked and untested.
      - name: Typecheck tooling
        run: pnpm typecheck:tooling

      - name: Test tooling
        run: pnpm test:tooling

  # The sandbox suite on its own runner: it is the longest package suite, it
  # writes no run report the registry reads, and nothing else waits for it.
  sandbox:
    name: sandbox package tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The sandbox package provisions real Linux containers: the mount layer
      # is where I1 is enforced, and a test that skipped itself without a
      # daemon would report green having proved nothing. Checked here so a
      # missing daemon fails with this message, and the images are pulled here
      # so a cold-cache pull is never timed against a wall-clock assertion.
      - name: Docker daemon and the pinned test images
        run: |
          docker version --format 'server {{.Server.Version}}, {{.Server.Os}} containers'
          docker pull --quiet alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          docker pull --quiet node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5

      - name: Sandbox tests
        run: pnpm --filter @olympus-ai/sandbox test

  # Every other package that writes no run report the registry reads. No
  # credential: no package here calls a model, and one that starts to should
  # refuse loudly rather than find a key waiting.
  packages:
    name: package tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Docker daemon and the pinned test images
        run: |
          docker version --format 'server {{.Server.Version}}, {{.Server.Os}} containers'
          docker pull --quiet alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          docker pull --quiet node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5

      - name: Test
        run: pnpm -r --filter '!@olympus-ai/sandbox' --filter '!@olympus-ai/driver-claude-code' --filter '!@olympus-ai/driver-codex' --filter '!@olympus-ai/driver-openai-compatible' --filter '!@olympus-ai/conformance' test

      # The conformance package's own suite, without the registry meta-test,
      # which the conformance job runs once against the drivers' reports.
      - name: Conformance package tests
        run: pnpm --filter @olympus-ai/conformance exec vitest run --exclude test/registry.test.ts

  # The drivers' and the line's run reports, then the registry over them.
  conformance:
    name: conformance registry
    runs-on: ubuntu-latest
    # Raised from 20 by R26 for the second driver's suite; the paid suites
    # and the registry are now this job's whole critical path.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The sandbox package and the I1 registry assertions provision real Linux
      # containers: the mount layer is where I1 is enforced, and an assertion
      # that skipped itself without a daemon would report green having proved
      # nothing about it. Checked here so a missing daemon fails with this
      # message, and the image is pulled here so a cold-cache pull is never
      # timed against a wall-clock assertion.
      - name: Docker daemon and the pinned test images
        run: |
          docker version --format 'server {{.Server.Version}}, {{.Server.Os}} containers'
          docker pull --quiet alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          docker pull --quiet node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5

      # Before the recursive test command, and the order is not incidental
      # (D-P5-23). The registry reconciles this package's external assertions
      # against a run report only this suite writes, and the recursive run
      # below tests conformance but not the driver. From a cold checkout there
      # would be no report, all nine would refuse, and nothing would write one.
      #
      # These assertions call a real model and refuse rather than skip without
      # a credential (I5). A fork pull request has no secret and fails here,
      # which is the correct outcome: a capability claim proven by a test that
      # did not run is worse than one reported pending.
      #
      # They run only when the tree they execute has changed (D-A-CI-04). The
      # report is cached under the hash the registry recomputes over the
      # driver and every workspace package it depends on, so a restored report
      # is evidence about these exact bytes, and one that is not is refused by
      # the registry as tree-changed. A wrong key costs a model run or a red
      # build, never a green one.
      #
      # On a pull request they run only once it carries the `run-driver` label,
      # which the maintainer adds when it is ready to merge (D-A-CI-05). A push
      # to v2 reuses a merged pull request's report for the same tree
      # (D-A-CI-06). Without the label and without a report for this
      # tree, every free step still runs, the registry does not, and the job
      # ends red saying why: an unproven tree never goes green.
      - name: Driver tree hash
        id: driver-tree
        run: echo "hash=$(node scripts/driver-report-key.ts packages/drivers/claude-code)" >> "$GITHUB_OUTPUT"

      - name: Driver report from an earlier run of the same tree
        id: driver-report
        uses: actions/cache/restore@v6
        with:
          path: packages/drivers/claude-code/.conformance/run.json
          key: driver-report-${{ steps.driver-tree.outputs.hash }}

      - name: Reused driver report
        if: steps.driver-report.outputs.cache-hit == 'true'
        run: |
          echo "::notice::driver assertions not re-run; reusing the report for tree ${{ steps.driver-tree.outputs.hash }}"
          grep -E '"(treeHash|generatedAt)"' packages/drivers/claude-code/.conformance/run.json

      # A push to v2 cannot see a pull request's cache, so a merge would pay
      # again for the tree its pull request already proved (D-A-CI-06). The
      # pull request's run keeps its report as an artifact too, and a push
      # reuses it when the hash matches. Only an artifact from a run of this
      # repository counts: a fork's run executes the fork's own workflow file.
      # The registry still refuses a report for other bytes as tree-changed.
      - name: Driver report from the merged pull request's run
        id: pr-report
        if: github.event_name == 'push' && steps.driver-report.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.driver-tree.outputs.hash }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=driver-report-${HASH}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .id // empty')"
          if [ -z "$id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > "$RUNNER_TEMP/report.zip"
          mkdir -p packages/drivers/claude-code/.conformance
          unzip -o "$RUNNER_TEMP/report.zip" -d packages/drivers/claude-code/.conformance
          echo "::notice::driver assertions not re-run; reusing the merged pull request's report for tree ${HASH}"
          grep -E '"(treeHash|generatedAt)"' packages/drivers/claude-code/.conformance/run.json
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Driver assertions, which write the conformance run report
        if: steps.driver-report.outputs.cache-hit != 'true' && steps.pr-report.outputs.found != 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver'))
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter @olympus-ai/driver-claude-code test

      # Until the label is added, the driver's tests that call no model still
      # run, and with no credential, so one that starts to call a model fails.
      - name: Driver tests that call no model
        if: steps.driver-report.outputs.cache-hit != 'true' && !(github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver'))
        run: pnpm --filter @olympus-ai/driver-claude-code exec vitest run test/driver.test.ts

      # Only after the step above passed: a failing run's report stays out of
      # the cache, so the next run of the same tree calls the model again. On
      # a push this also caches a report reused from the pull request, so
      # later pushes and pull requests on the same tree find it.
      - name: Keep the driver report for the next run of the same tree
        if: steps.driver-report.outputs.cache-hit != 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver'))
        uses: actions/cache/save@v6
        with:
          path: packages/drivers/claude-code/.conformance/run.json
          key: driver-report-${{ steps.driver-tree.outputs.hash }}

      # The same report, where the push that merges this pull request can find it.
      - name: Keep the driver report for the merge
        if: github.event_name == 'pull_request' && steps.driver-report.outputs.cache-hit != 'true' && contains(github.event.pull_request.labels.*.name, 'run-driver')
        uses: actions/upload-artifact@v4
        with:
          name: driver-report-${{ steps.driver-tree.outputs.hash }}
          path: packages/drivers/claude-code/.conformance/run.json
          # The report lives under a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 30

      # The Codex driver's paid assertions (R26), under the same rules as the
      # Claude Code driver's above: the run-driver label, one run per tree, a
      # merge reusing the pull request's report. They read OPENAI_API_KEY, a
      # CI-only key (A-R26-01), and the free tests still run without the label.
      # The free step runs every file that calls no model: the inspection and
      # the claims read the session's request on the sandbox's loopback.
      - name: Codex driver tree hash
        id: codex-tree
        run: echo "hash=$(node scripts/driver-report-key.ts packages/drivers/codex)" >> "$GITHUB_OUTPUT"

      - name: Codex driver report from an earlier run of the same tree
        id: codex-report
        uses: actions/cache/restore@v6
        with:
          path: packages/drivers/codex/.conformance/run.json
          key: codex-report-${{ steps.codex-tree.outputs.hash }}

      - name: Reused Codex driver report
        if: steps.codex-report.outputs.cache-hit == 'true'
        run: |
          echo "::notice::driver assertions not re-run; reusing the report for tree ${{ steps.codex-tree.outputs.hash }}"
          grep -E '"(treeHash|generatedAt)"' packages/drivers/codex/.conformance/run.json

      # A push to v2 cannot see a pull request's cache, so a merge would pay
      # again for the tree its pull request already proved (D-A-CI-06). The
      # pull request's run keeps its report as an artifact too, and a push
      # reuses it when the hash matches. Only an artifact from a run of this
      # repository counts: a fork's run executes the fork's own workflow file.
      # The registry still refuses a report for other bytes as tree-changed.
      - name: Codex driver report from the merged pull request's run
        id: codex-pr-report
        if: github.event_name == 'push' && steps.codex-report.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.codex-tree.outputs.hash }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=codex-report-${HASH}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .id // empty')"
          if [ -z "$id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > "$RUNNER_TEMP/report.zip"
          mkdir -p packages/drivers/codex/.conformance
          unzip -o "$RUNNER_TEMP/report.zip" -d packages/drivers/codex/.conformance
          echo "::notice::driver assertions not re-run; reusing the merged pull request's report for tree ${HASH}"
          grep -E '"(treeHash|generatedAt)"' packages/drivers/codex/.conformance/run.json
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Codex driver assertions, which write the conformance run report
        if: steps.codex-report.outputs.cache-hit != 'true' && steps.codex-pr-report.outputs.found != 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver'))
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm --filter @olympus-ai/driver-codex test

      # Until the label is added, the driver's tests that call no model still
      # run, and with no credential, so one that starts to call a model fails.
      - name: Codex driver tests that call no model
        if: steps.codex-report.outputs.cache-hit != 'true' && !(github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver'))
        run: pnpm --filter @olympus-ai/driver-codex exec vitest run test/driver.test.ts test/claims.test.ts

      # Only after the step above passed: a failing run's report stays out of
      # the cache, so the next run of the same tree calls the model again. On
      # a push this also caches a report reused from the pull request, so
      # later pushes and pull requests on the same tree find it.
      - name: Keep the Codex driver report for the next run of the same tree
        if: steps.codex-report.outputs.cache-hit != 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver'))
        uses: actions/cache/save@v6
        with:
          path: packages/drivers/codex/.conformance/run.json
          key: codex-report-${{ steps.codex-tree.outputs.hash }}

      # The same report, where the push that merges this pull request can find it.
      - name: Keep the Codex driver report for the merge
        if: github.event_name == 'pull_request' && steps.codex-report.outputs.cache-hit != 'true' && contains(github.event.pull_request.labels.*.name, 'run-driver')
        uses: actions/upload-artifact@v4
        with:
          name: codex-report-${{ steps.codex-tree.outputs.hash }}
          path: packages/drivers/codex/.conformance/run.json
          # The report lives under a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 30


      # The composed line's paid assertions (D-I1a-07): one L2 run on the
      # production composition, under the same rules as the driver's above —
      # the run-driver label, one run per tree, a merge reusing the pull
      # request's report. The key is the api package's tree, which takes in
      # the driver, since api depends on it.
      - name: Line tree hash
        id: line-tree
        run: echo "hash=$(node scripts/driver-report-key.ts packages/api)" >> "$GITHUB_OUTPUT"

      - name: Line report from an earlier run of the same tree
        id: line-report
        uses: actions/cache/restore@v6
        with:
          path: packages/api/.conformance/run.json
          key: line-report-${{ steps.line-tree.outputs.hash }}

      - name: Line report from the merged pull request's run
        id: line-pr-report
        if: github.event_name == 'push' && steps.line-report.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.line-tree.outputs.hash }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=line-report-${HASH}&per_page=100"             --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .id // empty')"
          if [ -z "$id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > "$RUNNER_TEMP/line-report.zip"
          mkdir -p packages/api/.conformance
          unzip -o "$RUNNER_TEMP/line-report.zip" -d packages/api/.conformance
          echo "::notice::line assertions not re-run; reusing the merged pull request's report for tree ${HASH}"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Line assertions, which write the api package's conformance run report
        if: steps.line-report.outputs.cache-hit != 'true' && steps.line-pr-report.outputs.found != 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver'))
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter @olympus-ai/api exec vitest run --config vitest.config.paid.ts

      - name: Keep the line report for the next run of the same tree
        if: steps.line-report.outputs.cache-hit != 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver'))
        uses: actions/cache/save@v6
        with:
          path: packages/api/.conformance/run.json
          key: line-report-${{ steps.line-tree.outputs.hash }}

      - name: Keep the line report for the merge
        if: github.event_name == 'pull_request' && steps.line-report.outputs.cache-hit != 'true' && contains(github.event.pull_request.labels.*.name, 'run-driver')
        uses: actions/upload-artifact@v4
        with:
          name: line-report-${{ steps.line-tree.outputs.hash }}
          path: packages/api/.conformance/run.json
          include-hidden-files: true
          retention-days: 30

      # The third driver's suite, which calls no model and writes the run
      # report the registry reconciles its external assertions against. Here
      # and not in the packages job, because the registry below reads it.
      - name: openai-compatible driver tests, which write its conformance run report
        run: pnpm --filter @olympus-ai/driver-openai-compatible test

      # The registry meta-test, once (D-TOOLING-15). It used to run twice: as
      # one file of the conformance package's own suite and again here, the
      # same file over the same tree. Its report is the last thing in the log:
      # every invariant's state, every pending entry, and the unit that owes
      # it. A `missing` invariant fails this step. It runs with or without the
      # run-driver label, as the package suite's copy did, so its local
      # assertions report on every push; without a report for this tree its
      # external assertions refuse, and the steps below say which suite is owed.
      - name: Conformance registry
        run: pnpm conformance

      - name: Driver suite not yet run for this tree
        if: ${{ !cancelled() && steps.driver-report.outputs.cache-hit != 'true' && !(github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver')) }}
        run: |
          echo "::error::the driver's real-model assertions have not run for tree ${{ steps.driver-tree.outputs.hash }}, so the conformance registry was not evaluated. Add the run-driver label to this pull request when it is ready to merge; that run calls the model once."
          exit 1

      - name: Codex driver suite not yet run for this tree
        if: ${{ !cancelled() && steps.codex-report.outputs.cache-hit != 'true' && !(github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver')) }}
        run: |
          echo "::error::the Codex driver's real-model assertions have not run for tree ${{ steps.codex-tree.outputs.hash }}, so the conformance registry was not evaluated. Add the run-driver label to this pull request when it is ready to merge."
          exit 1

      - name: Line suite not yet run for this tree
        if: ${{ !cancelled() && steps.line-report.outputs.cache-hit != 'true' && !(github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-driver')) }}
        run: |
          echo "::error::the composed line's real-model assertions have not run for tree ${{ steps.line-tree.outputs.hash }}, so the conformance registry was not evaluated. Add the run-driver label to this pull request when it is ready to merge; that run calls the model twice."
          exit 1

  # The required status check. It runs whatever the four jobs did and passes
  # only when every one succeeded: a failed, cancelled, or skipped job fails
  # it, so a job that never ran can never count as green (I5).
  gate:
    name: typecheck, lint, test, conformance
    if: always()
    needs: [static, sandbox, packages, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$failed" ]; then
            echo "::error::not every check job succeeded: ${failed}"
            exit 1
          fi

  # The false-done benchmark's deterministic tier (R7, D-R7-06): every
  # deterministic item of the current corpus through the real line, with the
  # result held byte for byte to the one committed in docs/benchmark/. A
  # control that stops catching an item, or starts refusing a clean one,
  # changes the result and fails here until a commit records the new one
  # (I8). Its own job, because each item is a run of several containers and
  # the tier outlasts the conformance job's limit. No credential: no seat calls a
  # model.
  benchmark:
    name: false-done benchmark, deterministic tier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The check image, the egress proxy the install reaches the registry through, and the two pinned scanners.
      - name: Docker daemon and the pinned images
        run: |
          docker version --format 'server {{.Server.Version}}, {{.Server.Os}} containers'
