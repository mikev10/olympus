name: Protected paths

# Two triggers, because there are two ways a gate-enforcing path can change.
#
# A pull request is acknowledged with the 'gate-change' label. A push straight
# to v2 has no pull request and therefore no label, so it is acknowledged with
# a `Gate-Change: acknowledged` trailer in the commit message of every commit
# that touches one. The trailer is the better record of the two: a label lives
# in GitHub metadata and can be removed afterwards, while the trailer is part
# of the commit and travels with it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [v2]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail on unlabelled gate changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # contains() over the label-name array is element equality: only a
          # label named exactly 'gate-change' counts. A joined string would
          # let 'not gate-change approved' pass a substring match.
          HAS_GATE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'gate-change') }}
        run: |
          set -euo pipefail

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          HITS=""
          while read -r pattern; do
            case "$pattern" in ''|'#'*) continue ;; esac
            MATCH=$(printf '%s\n' "$CHANGED" | grep -E "$pattern" || true)
            [ -n "$MATCH" ] && HITS="$HITS$MATCH"$'\n'
          done < .github/protected-paths.txt

          HITS=$(printf '%s' "$HITS" | sed '/^$/d' | sort -u)

          if [ -z "$HITS" ]; then
            echo "No protected paths touched."
            exit 0
          fi

          echo "This PR modifies paths that enforce the gates:"
          printf '  %s\n' $HITS
          echo

          if [ "$HAS_GATE_LABEL" = "true" ]; then
            echo "Label 'gate-change' present. Allowed."
            echo "Reviewer: confirm each change above is intended and is not"
            echo "a control being weakened to make other work pass."
            exit 0
          fi

          echo "FAILED: add the 'gate-change' label to acknowledge these edits."
          echo
          echo "An agent that can quietly edit a check has no check. The label"
          echo "exists so weakening a control is a decision someone made, not a"
          echo "side effect nobody noticed."
          exit 1

      - name: Fail on unacknowledged gate changes pushed straight to v2
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          EMPTY='0000000000000000000000000000000000000000'
          if [ "$BEFORE" = "$EMPTY" ]; then
            echo "Branch created; no previous tip to compare against."
            exit 0
          fi

          # A push that carries a merge is a pull request landing, and the
          # pull_request trigger above already guarded it with the label. The
          # individual commits from the unit branch are in this range too, and
          # they carry no trailer because they were never meant to — the label
          # was their acknowledgement.
          #
          # Honest limit: a merge made locally and pushed straight here is
          # indistinguishable from a pull request landing, so it is not caught.
          # This check closes the gap for direct commits, which is the one that
          # was actually being used.
          if [ -n "$(git rev-list --merges "$BEFORE..$AFTER")" ]; then
            echo "This push contains a merge; the pull-request check is authoritative for it."
            exit 0
          fi

          FAILED=0
          for sha in $(git rev-list --no-merges "$BEFORE..$AFTER"); do
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$sha")
            HITS=""
            while read -r pattern; do
              case "$pattern" in ''|'#'*) continue ;; esac
              MATCH=$(printf '%s\n' "$CHANGED" | grep -E "$pattern" || true)
              [ -n "$MATCH" ] && HITS="$HITS$MATCH"$'\n'
            done < .github/protected-paths.txt

            HITS=$(printf '%s' "$HITS" | sed '/^$/d' | sort -u)
            [ -z "$HITS" ] && continue

            SUBJECT=$(git log -1 --format=%s "$sha")
            echo "$sha  $SUBJECT"
            printf '    %s\n' $HITS

            # The trailer must be its own line. A mention inside prose does not
            # count, for the same reason the label is matched by element
            # equality rather than substring.
            if git log -1 --format=%B "$sha" | grep -qE '^Gate-Change:[[:space:]]*acknowledged[[:space:]]*$'; then
              echo "    Gate-Change trailer present. Allowed."
            else
              echo "    FAILED: no 'Gate-Change: acknowledged' trailer."
              FAILED=1
            fi
            echo
          done

          if [ "$FAILED" -eq 0 ]; then
            echo "No unacknowledged gate changes in this push."
            exit 0
          fi

          echo "FAILED: a commit pushed straight to v2 edits a path that enforces"
          echo "the gates, without acknowledging it."
          echo
          echo "An agent that can quietly edit a check has no check. On a pull"
          echo "request the 'gate-change' label is the acknowledgement; there is"
          echo "no pull request here, so the commit message is. Add a trailer on"
          echo "its own line:"
          echo
          echo "    Gate-Change: acknowledged"
          echo
          echo "Or move the change onto a branch and open a pull request, which"
          echo "is the better route when anyone else should see it first."
          exit 1
