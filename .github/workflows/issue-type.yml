name: Issue type

# Every issue carries exactly one type label: bug, enhancement, documentation,
# or question. The issue forms apply one, but an issue opened through the API
# or the CLI may carry none. Such an issue gets 'needs-triage' so it is found
# and typed; the label comes off once a type label is added.
on:
  issues:
    types: [opened, reopened, labeled, unlabeled]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Mark issues without a type label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          # Passed as JSON through the environment, never interpolated into the
          # script, so a label name cannot inject shell.
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail
          typed="$(jq -r '[.[] | select(. == "bug" or . == "enhancement" or . == "documentation" or . == "question")] | length' <<<"$LABELS")"
          triage="$(jq -r 'any(.[]; . == "needs-triage")' <<<"$LABELS")"
          if [ "$typed" -eq 0 ] && [ "$triage" = false ]; then
            gh issue edit "$NUMBER" --repo "$REPO" --add-label needs-triage
          elif [ "$typed" -gt 0 ] && [ "$triage" = true ]; then
            gh issue edit "$NUMBER" --repo "$REPO" --remove-label needs-triage
          fi
