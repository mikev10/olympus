<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Olympus social preview</title>
<!-- GitHub social preview, rendered to ../social-preview.png at 1280x640. Edit the copy below, then re-render. -->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink: '#0A0A0B', signal: '#22C55E' },
    fontFamily: { display: ['Outfit', 'sans-serif'], body: ['Inter', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] },
  } } };
</script>
<style>
  .scrim { background:
    linear-gradient(0deg, #0A0A0B 0%, #0A0A0B 18%, rgba(10,10,11,0) 30%),
    linear-gradient(90deg, #0A0A0B 0%, #0A0A0B 38%, rgba(10,10,11,.85) 48%, rgba(10,10,11,0) 60%); }
  .station svg { width: 30px; height: 30px; stroke-width: 2.25; }
</style>
</head>
<body class="m-0 bg-ink">
<main id="frame" class="relative overflow-hidden bg-ink" style="width:1280px;height:640px">
  <canvas id="bg" width="1280" height="640" class="absolute inset-0"></canvas>
  <div class="scrim absolute inset-0"></div>
  <div class="relative flex h-full flex-col px-16 pt-16 pb-14">
    <p class="font-display text-[44px] leading-none tracking-[-0.03em] text-white">Olympus</p>
    <h1 class="mt-16 font-display text-[72px] leading-[0.98] tracking-[-0.035em] text-white">Done is <span class="text-signal">earned,</span><br>not reported.</h1>
    <p class="mt-6 max-w-[540px] font-body text-[19px] leading-[1.5] text-zinc-300">An open-source software factory where every merge carries evidence no agent can write or alter.</p>
    <ol id="stations" class="mt-auto grid grid-cols-10 gap-2 border-t border-zinc-800 pt-6"></ol>
  </div>
</main>
<script>
  const stations = [
    ['intake', 'inbox'], ['spec', 'file-lock'], ['test-design', 'flask-conical'], ['plan', 'git-fork'], ['build', 'hammer'],
    ['verify', 'shield-check'], ['review', 'eye'], ['integrate', 'git-merge'], ['observe', 'activity'], ['learn', 'graduation-cap'],
  ];
  document.getElementById('stations').innerHTML = stations.map(([name, icon]) => {
    const on = name === 'verify';
    return `<li class="station flex flex-col items-center gap-2 ${on ? 'text-signal' : 'text-zinc-400'}">
      <i data-lucide="${icon}"></i><span class="font-mono text-[13px]">${name}</span></li>`;
  }).join('');
  lucide.createIcons();

  // The same constellation as the banner, scaled up. The icon row names the stations, so only verify is labelled here.
  document.fonts.ready.then(() => {
    const W = 1280, H = 640, GREEN = '#22C55E';
    const g = document.getElementById('bg').getContext('2d');
    let a = 11;
    const R = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    for (let k = 0; k < 600; k++) { g.fillStyle = 'rgba(255,255,255,' + (.12 + R() * .5) + ')'; g.beginPath(); g.arc(R() * W, R() * H, .4 + R() * 1.1, 0, 7); g.fill(); }
    const st = [[700, 250], [752, 206], [806, 232], [862, 164], [916, 188], [980, 74], [1036, 150], [1088, 120], [1146, 190], [1206, 240]]
      .map(([x, y]) => [752 + (x - 700) * 0.96, 104 + (y - 74) * 1.75]);
    g.strokeStyle = 'rgba(255,255,255,.38)'; g.lineWidth = 1.6; g.beginPath();
    st.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
    st.forEach(([x, y], i) => {
      const v = i === 5;
      g.fillStyle = v ? GREEN : '#FFFFFF'; g.beginPath(); g.arc(x, y, v ? 6 : 3.5, 0, 7); g.fill();
      if (v) {
        g.strokeStyle = GREEN; g.lineWidth = 1.75; g.beginPath(); g.arc(x, y, 13, 0, 7); g.stroke();
        g.font = '500 14px "JetBrains Mono"'; g.textAlign = 'center'; g.fillStyle = GREEN; g.fillText('verify', x, y - 24);
      }
    });
  });
</script>
</body>
</html>
